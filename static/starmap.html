<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>research :: star map</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div class="grid-bg"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-glyph">&gt;_</span>
    <span class="brand-text">research<span class="brand-domain">/star-map</span></span>
  </div>
  <nav class="topnav">
    <a href="/" class="back-link">&larr; back to achievements</a>
  </nav>
</header>

<main class="wrap">
  <section class="convergence-panel">
    <div class="convergence-row">
      <div class="convergence-label">sky illuminated</div>
      <div class="convergence-value" id="sky-percent">0.00%</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="sky-progress-fill"></div>
    </div>
    <div class="convergence-meta" id="sky-meta">0 stars charted</div>
  </section>

  <div class="mastery-legend">
    <span class="legend-item"><span class="legend-dot m0"></span>0 unlit</span>
    <span class="legend-item"><span class="legend-dot m1"></span>1 glimmer</span>
    <span class="legend-item"><span class="legend-dot m2"></span>2 shine</span>
    <span class="legend-item"><span class="legend-dot m3"></span>3 bright</span>
    <span class="legend-item"><span class="legend-dot m4"></span>4 blazing</span>
  </div>

  <section class="controls">
    <div class="tag-filter grouped" id="tag-filter"></div>
    <button class="btn btn-add" id="open-add-form">+ new star</button>
  </section>

  <section class="add-form hidden" id="add-form">
    <h2 id="add-form-title">chart new star</h2>
    <div class="form-row">
      <label>title</label>
      <input type="text" id="form-title" placeholder="e.g. Position Based Fluids">
    </div>
    <div class="form-row">
      <label>kind</label>
      <select id="form-kind">
        <option value="paper">paper</option>
        <option value="concept">concept</option>
      </select>
    </div>
    <div class="form-row">
      <label>description <span class="hint">(optional)</span></label>
      <textarea id="form-description" placeholder="one-line summary / notes"></textarea>
    </div>
    <div class="form-row">
      <label>tags <span class="hint">(comma separated)</span></label>
      <input type="text" id="form-tags" placeholder="sph, particle, fluids">
    </div>
    <div class="form-row">
      <label>url <span class="hint">(optional)</span></label>
      <input type="text" id="form-url" placeholder="arXiv / DOI / project page">
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" id="cancel-add-form">cancel</button>
      <button class="btn btn-submit" id="submit-add-form">commit</button>
    </div>
  </section>

  <div class="starmap-layout">
    <div class="starmap-canvas" id="starmap-canvas"></div>
    <div class="side-panel hidden" id="side-panel"></div>
  </div>
</main>

<div class="node-tooltip" id="node-tooltip"></div>

<script src="/static/starmap.js"></script>
</body>
</html>
