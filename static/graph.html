<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>research :: knowledge graph (preview)</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div class="grid-bg"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-glyph">&gt;_</span>
    <span class="brand-text">research<span class="brand-domain">/knowledge-graph</span></span>
  </div>
  <nav class="topnav">
    <a href="/" class="back-link">&larr; back to achievements</a>
  </nav>
</header>

<main class="wrap">
  <div class="preview-banner">
    <strong>preview.</strong> Read-only demo of a handful of seeded concepts and papers linked to
    existing achievements via the generic <code>edges</code> table. No add/edit UI yet.
  </div>

  <div class="graph-legend">
    <span class="legend-item"><span class="legend-dot achievement"></span>achievement</span>
    <span class="legend-item"><span class="legend-dot concept"></span>concept</span>
    <span class="legend-item"><span class="legend-dot paper"></span>paper</span>
  </div>

  <div class="graph-canvas" id="graph-canvas"></div>
</main>

<div class="node-tooltip" id="node-tooltip"></div>

<script src="/static/graph.js"></script>
</body>
</html>
